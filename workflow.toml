schema_version = 1
project = "GopherMailForge"
profile = "medium"
active_feature = "v0.foundation"
coverage_map = "workflow/COVERAGE.md"
event_log = "workflow.events.jsonl"

[repository]
main_branch = "main"
remote = "origin"
canonical_remote_url = "forgejo:linus/GopherMailForge.git"
worktree_root = "/tmp/gophermailforge-worktrees"
source_root = "."
workflow_root = "workflow"

[verification]
default_commands = [
  "git diff --check",
  "go test ./..."
]
notes = "Docs-only features use git diff --check and traceability checks until code exists. Implementation features must add relevant Go/unit/contract/integration tests before done."

