services:
  gotth-mail:
    build:
      context: ../..
    restart: "on-failure:5"
    environment:
      GOTTH_MAIL_LISTEN: ":8080"
      GOTTH_MAIL_REFERENCE_FIXTURE: "1"
      GOTTH_MAIL_POSTFIX_POLICY_LISTEN: ":10025"
      GOTTH_MAIL_DATABASE_URL: postgres://gotth_mail:gotth-mail-dev-only@database:5432/gotth_mail?sslmode=disable
      GOTTH_MAIL_POSTFIX_HELPER_URL: http://postfix:10026
      GOTTH_MAIL_POSTFIX_HELPER_TOKEN: ${GOTTH_MAIL_POSTFIX_HELPER_TOKEN:-reference-postfix-helper-token-32bytes}
      GOTTH_MAIL_POSTFIX_RELEASE_TOKEN: ${GOTTH_MAIL_POSTFIX_RELEASE_TOKEN:-reference-postfix-release-token-32byte}
      GOTTH_MAIL_NOTIFICATION_EMAIL_FROM: ${GOTTH_MAIL_NOTIFICATION_EMAIL_FROM:-}
      GOTTH_MAIL_POSTFIX_AUTOMATIC_SENDER_ID: system:mailer-daemon@example.test
      GOTTH_MAIL_POSTFIX_AUTOMATIC_SENDER_ADDRESS: mailer-daemon@example.test
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      external-webmail-plugin:
        condition: service_started
      manual-dns-plugin:
        condition: service_started
      cert-plugin:
        condition: service_started
      backup-plugin:
        condition: service_started
      notification-plugin:
        condition: service_started
  test-runner:
    build:
      context: ../..
      target: build
    profiles: ["test"]
    command: ["go", "test", "./..."]

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gotth_mail
      POSTGRES_USER: gotth_mail
      POSTGRES_PASSWORD: gotth-mail-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotth_mail -d gotth_mail"]
      interval: 1s
      timeout: 3s
      retries: 30
  mailu-redis:
    image: redis:alpine
    profiles: ["mailu-import"]
    volumes:
      - mailu-redis:/data
  mailu-admin:
    image: ghcr.io/mailu/admin:2.0
    profiles: ["mailu-import"]
    environment:
      MAILU_VERSION: "2.0"
      DOCKER_ORG: ghcr.io/mailu
      DOCKER_PREFIX: ""
      SECRET_KEY: gotth-mail-mailu-fixture-dev-only
      DOMAIN: example.test
      HOSTNAMES: mail.example.test
      POSTMASTER: postmaster
      TLS_FLAVOR: notls
      AUTH_RATELIMIT_IP: 100000/hour
      AUTH_RATELIMIT_USER: 100000/day
      DISABLE_STATISTICS: "True"
      ADMIN: "true"
      WEB_ADMIN: /admin
      WEB_WEBMAIL: /webmail
      WEB_API: /api
      WEBMAIL: none
      SITENAME: GOTTH Mail Fixture
      WEBSITE: https://example.test
      SESSION_COOKIE_SECURE: "False"
      INITIAL_ADMIN_ACCOUNT: postmaster
      INITIAL_ADMIN_DOMAIN: example.test
      INITIAL_ADMIN_PW: gotth-mail-dev-postmaster
      INITIAL_ADMIN_MODE: ifmissing
      LOG_LEVEL: INFO
      SUBNET: 172.28.241.0/24
      REDIS_HOST: mailu-redis
    volumes:
      - mailu-data:/data
      - mailu-dkim:/dkim
    depends_on:
      - mailu-redis

  authentik:
    image: ghcr.io/goauthentik/server:latest
    command: server
    profiles: ["identity"]
    environment:
      AUTHENTIK_SECRET_KEY: dev-only-change-me
      AUTHENTIK_POSTGRESQL__HOST: database
      AUTHENTIK_POSTGRESQL__USER: gotth_mail
      AUTHENTIK_POSTGRESQL__PASSWORD: gotth-mail-dev-only
      AUTHENTIK_POSTGRESQL__NAME: gotth_mail
  postfix:
    build:
      context: ../..
      dockerfile: compose/reference/postfix/Dockerfile
    environment:
      GOTTH_MAIL_CORE_URL: http://gotth-mail:8080
      GOTTH_MAIL_POSTFIX_HELPER_TOKEN: ${GOTTH_MAIL_POSTFIX_HELPER_TOKEN:-reference-postfix-helper-token-32bytes}
      GOTTH_MAIL_POSTFIX_RELEASE_TOKEN: ${GOTTH_MAIL_POSTFIX_RELEASE_TOKEN:-reference-postfix-release-token-32byte}
      GOTTH_MAIL_POSTFIX_INSTANCE: mail.example.test
      GOTTH_MAIL_OUTBOUND_RELAY_ADDR: ${GOTTH_MAIL_OUTBOUND_RELAY_ADDR:-127.0.0.1:9}
      GOTTH_MAIL_SYSTEM_SENDER_SMTP_USERNAME: ${GOTTH_MAIL_SYSTEM_SENDER_SMTP_USERNAME:-system:alerts@example.test}
      GOTTH_MAIL_SYSTEM_SENDER_SMTP_PASSWORD: ${GOTTH_MAIL_SYSTEM_SENDER_SMTP_PASSWORD:-reference-system-sender-smtp-secret}
    command:
      - /bin/sh
      - -lc
      - |
        addgroup -g 5000 vmail || true
        adduser -D -H -u 5000 -G vmail vmail || true
        mkdir -p /mail/example.test/smoke/{cur,new,tmp} /mail/example.test/postmaster/{cur,new,tmp}
        chown -R 5000:5000 /mail
        cp /reference/postfix/main.cf /etc/postfix/main.cf
        cat /reference/postfix/gotth-policy.master.cf >> /etc/postfix/master.cf
        mkdir -p /etc/sasl2
        printf 'pwcheck_method: auxprop\nauxprop_plugin: sasldb\nmech_list: CRAM-MD5\nsasldb_path: /etc/sasldb2\n' > /etc/sasl2/smtpd.conf
        test -n "$$GOTTH_MAIL_SYSTEM_SENDER_SMTP_USERNAME"
        test -n "$$GOTTH_MAIL_SYSTEM_SENDER_SMTP_PASSWORD"
        printf '%s' "$$GOTTH_MAIL_SYSTEM_SENDER_SMTP_PASSWORD" | saslpasswd2 -c -p -f /etc/sasldb2 -a smtp "$$GOTTH_MAIL_SYSTEM_SENDER_SMTP_USERNAME"
        chown root:postfix /etc/sasldb2
        chmod 0640 /etc/sasldb2
        until curl -fsS http://gotth-mail:8080/healthz >/dev/null; do sleep 1; done
        curl -fsS -H 'X-Correlation-ID: postfix-mapgen' http://gotth-mail:8080/internal/v1/postfix/mailboxes/smoke@example.test | jq -e '.decision == "ok"' >/dev/null
        curl -fsS -H 'X-Correlation-ID: postfix-mapgen' http://gotth-mail:8080/internal/v1/postfix/mailboxes/postmaster@example.test | jq -e '.decision == "ok"' >/dev/null
        alias_targets=$$(curl -fsS -H 'X-Correlation-ID: postfix-mapgen' http://gotth-mail:8080/internal/v1/postfix/aliases/alias@example.test | jq -r 'select(.decision == "ok") | .targets | join(",")')
        test "$$alias_targets" = "smoke@example.test"
        forward_targets=$$(curl -fsS -H 'X-Correlation-ID: postfix-mapgen' http://gotth-mail:8080/internal/v1/postfix/aliases/forward@example.test | jq -r 'select(.decision == "ok") | .targets | join(", ")')
        test "$$forward_targets" = "outside@example.net, second@example.net"
        printf 'smoke@example.test example.test/smoke/\npostmaster@example.test example.test/postmaster/\n' > /etc/postfix/virtual_mailboxes
        printf 'alias@example.test %s\nforward@example.test %s\n' "$$alias_targets" "$$forward_targets" > /etc/postfix/virtual_aliases
        printf '<> gotth_automatic:\n' > /etc/postfix/sender_default_transports
        postmap lmdb:/etc/postfix/virtual_mailboxes
        postmap lmdb:/etc/postfix/virtual_aliases
        postmap lmdb:/etc/postfix/sender_default_transports
        postfix check
        /usr/local/bin/gotth-mail-postfix-gate helper &
        exec postfix start-fg
    volumes:
      - maildata:/mail
      - ./postfix:/reference/postfix:ro
    depends_on:
      - gotth-mail
      - rspamd
    ports:
      - "2525:25"
  dovecot:
    image: alpine:3.19
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache dovecot busybox-extras curl jq >/dev/null
        addgroup -g 5000 vmail || true
        adduser -D -H -u 5000 -G vmail vmail || true
        mkdir -p /mail/example.test/smoke/{cur,new,tmp} /mail/example.test/postmaster/{cur,new,tmp}
        chown -R 5000:5000 /mail
        cp /reference/dovecot/dovecot.conf /etc/dovecot/dovecot.conf
        until curl -fsS http://gotth-mail:8080/healthz >/dev/null; do sleep 1; done
        curl -fsS -H 'X-Correlation-ID: dovecot-passdb-gen' -H 'Content-Type: application/json' -d '{"username":"smoke@example.test","secret":"smoke-secret","protocol":"imap"}' http://gotth-mail:8080/internal/v1/dovecot/passdb | jq -e '.decision == "ok"' >/dev/null
        curl -fsS -H 'X-Correlation-ID: dovecot-passdb-gen' http://gotth-mail:8080/internal/v1/dovecot/userdb/smoke@example.test >/tmp/smoke-userdb.json
        smoke_home=$$(jq -r 'select(.decision == "ok") | .home' /tmp/smoke-userdb.json)
        smoke_uid=$$(jq -r 'select(.decision == "ok") | .uid' /tmp/smoke-userdb.json)
        smoke_gid=$$(jq -r 'select(.decision == "ok") | .gid' /tmp/smoke-userdb.json)
        smoke_hash=$$(doveadm pw -s SHA512-CRYPT -p smoke-secret)
        printf 'smoke@example.test:%s:%s:%s::%s::\n' "$$smoke_hash" "$$smoke_uid" "$$smoke_gid" "$$smoke_home" > /etc/dovecot/passwd
        exec dovecot -F
    volumes:
      - maildata:/mail
      - ./dovecot:/reference/dovecot:ro
    depends_on:
      - gotth-mail
    ports:
      - "2143:143"
  rspamd:
    image: alpine:3.22
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache rspamd curl jq >/dev/null
        mkdir -p /run/rspamd/dkim /etc/rspamd/local.d
        cp /reference/rspamd/local.d/* /etc/rspamd/local.d/
        until curl -fsS http://gotth-mail:8080/healthz >/dev/null; do sleep 1; done
        curl -fsS -H 'X-Correlation-ID: rspamd-dkim-gen' http://gotth-mail:8080/internal/v1/rspamd/dkim/example.test | jq -e '.decision == "ok" and .selector == "mail"' >/dev/null
        curl -fsS -H 'X-Correlation-ID: rspamd-dkim-gen' -H 'Content-Type: application/json' -d '{"domain":"example.test"}' http://gotth-mail:8080/internal/v1/rspamd/signing-decision | jq -e '.decision == "ok"' >/dev/null
        rspamadm dkim_keygen -d example.test -s mail -k /run/rspamd/dkim/example.test.mail.key >/run/rspamd/dkim/example.test.mail.txt
        chown -R rspamd:rspamd /run/rspamd/dkim
        chmod 0400 /run/rspamd/dkim/example.test.mail.key
        exec rspamd -f -u rspamd -g rspamd
    volumes:
      - dkimdata:/run/rspamd/dkim
      - ./rspamd:/reference/rspamd:ro
    depends_on:
      - gotth-mail
    ports:
      - "11332:11332"
      - "11333:11333"
      - "11334:11334"
  webmail:
    image: roundcube/roundcubemail:1.6.x-apache
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: postfix
      ROUNDCUBEMAIL_SMTP_PORT: "25"
      ROUNDCUBEMAIL_USERNAME_DOMAIN: example.test
    depends_on:
      - dovecot
      - postfix
      - external-webmail-plugin
    ports:
      - "8081:80"
  external-webmail-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gotth-mail-plugin"]
    environment:
      GOTTH_MAIL_PLUGIN_NAME: external-webmail
      GOTTH_MAIL_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  manual-dns-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gotth-mail-plugin"]
    environment:
      GOTTH_MAIL_PLUGIN_NAME: manual-dns-export
      GOTTH_MAIL_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  cert-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gotth-mail-plugin"]
    environment:
      GOTTH_MAIL_PLUGIN_NAME: manual-letsencrypt-cert
      GOTTH_MAIL_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  backup-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gotth-mail-plugin"]
    environment:
      GOTTH_MAIL_PLUGIN_NAME: local-filesystem-backup
      GOTTH_MAIL_PLUGIN_SERVICE_TOKEN: dev-plugin-token
    volumes:
      - backup-data:/backup
  notification-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gotth-mail-plugin"]
    environment:
      GOTTH_MAIL_PLUGIN_NAME: telegram-notification-sink
      GOTTH_MAIL_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  signed-email-notification-plugin:
    profiles: ["signed-email-notification"]
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gotth-mail-plugin"]
    environment:
      GOTTH_MAIL_PLUGIN_NAME: signed-email-notification-sink
      GOTTH_MAIL_PLUGIN_SERVICE_TOKEN: ${GOTTH_MAIL_SIGNED_EMAIL_PLUGIN_SERVICE_TOKEN:-dev-plugin-token}
      GOTTH_MAIL_NOTIFICATION_EMAIL_FROM: ${GOTTH_MAIL_NOTIFICATION_EMAIL_FROM:-}
      GOTTH_MAIL_NOTIFICATION_EMAIL_TO: ${GOTTH_MAIL_NOTIFICATION_EMAIL_TO:-}
      GOTTH_MAIL_NOTIFICATION_EMAIL_SIGNING_FINGERPRINT: ${GOTTH_MAIL_NOTIFICATION_EMAIL_SIGNING_FINGERPRINT:-}
      GOTTH_MAIL_NOTIFICATION_EMAIL_PRIVATE_KEY_FILE: /run/secrets/notification-signing-key.asc
      GOTTH_MAIL_NOTIFICATION_EMAIL_SMTP_ADDR: ${GOTTH_MAIL_NOTIFICATION_EMAIL_SMTP_ADDR:-postfix:25}
      GOTTH_MAIL_NOTIFICATION_EMAIL_SMTP_USERNAME: ${GOTTH_MAIL_NOTIFICATION_EMAIL_SMTP_USERNAME:-system:alerts@example.test}
      GOTTH_MAIL_NOTIFICATION_EMAIL_SMTP_PASSWORD: ${GOTTH_MAIL_SYSTEM_SENDER_SMTP_PASSWORD:-reference-system-sender-smtp-secret}
      GOTTH_MAIL_OUTBOUND_POLICY_URL: http://gotth-mail:8080/internal/v1/postfix/outbound-policy
    volumes:
      - type: bind
        source: ${GOTTH_MAIL_NOTIFICATION_EMAIL_PRIVATE_KEY_SOURCE:-./secrets/notification-signing-key.asc}
        target: /run/secrets/notification-signing-key.asc
        read_only: true
    depends_on:
      - gotth-mail
      - postfix
volumes:
  backup-data:
  maildata:
  dkimdata:
  mailu-data:
  mailu-dkim:
  mailu-redis:
