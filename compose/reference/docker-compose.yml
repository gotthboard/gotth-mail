services:
  gophermailforge:
    build:
      context: ../..
    environment:
      GMF_LISTEN: ":8080"
      GMF_REFERENCE_FIXTURE: "1"
    ports:
      - "8080:8080"
    depends_on:
      - database
      - postfix
      - dovecot
      - rspamd
      - webmail
      - external-webmail-plugin
      - manual-dns-plugin
      - cert-plugin
      - backup-plugin
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gophermailforge
      POSTGRES_USER: gmf
      POSTGRES_PASSWORD: gmf-dev-only
  authentik:
    image: ghcr.io/goauthentik/server:latest
    command: server
    profiles: ["identity"]
    environment:
      AUTHENTIK_SECRET_KEY: dev-only-change-me
      AUTHENTIK_POSTGRESQL__HOST: database
      AUTHENTIK_POSTGRESQL__USER: gmf
      AUTHENTIK_POSTGRESQL__PASSWORD: gmf-dev-only
      AUTHENTIK_POSTGRESQL__NAME: gophermailforge
  postfix:
    image: alpine:3.22
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache postfix busybox-extras >/dev/null
        addgroup -g 5000 vmail || true
        adduser -D -H -u 5000 -G vmail vmail || true
        mkdir -p /mail/example.test/smoke/{cur,new,tmp} /mail/example.test/postmaster/{cur,new,tmp}
        chown -R 5000:5000 /mail
        cp /reference/postfix/main.cf /etc/postfix/main.cf
        cp /reference/postfix/virtual_mailboxes /etc/postfix/virtual_mailboxes
        cp /reference/postfix/virtual_aliases /etc/postfix/virtual_aliases
        postmap lmdb:/etc/postfix/virtual_mailboxes
        postmap lmdb:/etc/postfix/virtual_aliases
        postfix check
        exec postfix start-fg
    volumes:
      - maildata:/mail
      - ./postfix:/reference/postfix:ro
    ports:
      - "2525:25"
  dovecot:
    image: alpine:3.19
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache dovecot busybox-extras >/dev/null
        addgroup -g 5000 vmail || true
        adduser -D -H -u 5000 -G vmail vmail || true
        mkdir -p /mail/example.test/smoke/{cur,new,tmp} /mail/example.test/postmaster/{cur,new,tmp}
        chown -R 5000:5000 /mail
        cp /reference/dovecot/dovecot.conf /etc/dovecot/dovecot.conf
        cp /reference/dovecot/passwd /etc/dovecot/passwd
        exec dovecot -F
    volumes:
      - maildata:/mail
      - ./dovecot:/reference/dovecot:ro
    ports:
      - "2143:143"
  rspamd:
    image: alpine:3.22
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache rspamd curl >/dev/null
        mkdir -p /run/rspamd/dkim /etc/rspamd/local.d
        cp /reference/rspamd/local.d/* /etc/rspamd/local.d/
        rspamadm dkim_keygen -d example.test -s mail -k /run/rspamd/dkim/example.test.mail.key >/run/rspamd/dkim/example.test.mail.txt
        exec rspamd -f -u rspamd -g rspamd
    volumes:
      - dkimdata:/run/rspamd/dkim
      - ./rspamd:/reference/rspamd:ro
    ports:
      - "11333:11333"
      - "11334:11334"
  webmail:
    image: alpine:3.22
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache busybox-extras >/dev/null
        exec httpd -f -p 8080 -h /mail
    volumes:
      - maildata:/mail:ro
    ports:
      - "8081:8080"
  external-webmail-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: external-webmail
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  manual-dns-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: manual-dns-export
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  cert-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: manual-letsencrypt-cert
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  backup-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: local-filesystem-backup
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
    volumes:
      - backup-data:/backup
volumes:
  backup-data:
  maildata:
  dkimdata:
