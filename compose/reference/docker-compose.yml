services:
  gophermailforge:
    build:
      context: ../..
    environment:
      GMF_LISTEN: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - database
      - authentik
      - external-webmail-plugin
      - manual-dns-plugin
      - cert-plugin
      - backup-plugin
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gophermailforge
      POSTGRES_USER: gmf
      POSTGRES_PASSWORD: gmf-dev-only
  authentik:
    image: ghcr.io/goauthentik/server:latest
    command: server
    profiles: ["identity"]
    environment:
      AUTHENTIK_SECRET_KEY: dev-only-change-me
      AUTHENTIK_POSTGRESQL__HOST: database
      AUTHENTIK_POSTGRESQL__USER: gmf
      AUTHENTIK_POSTGRESQL__PASSWORD: gmf-dev-only
      AUTHENTIK_POSTGRESQL__NAME: gophermailforge
  external-webmail-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: external-webmail
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  manual-dns-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: manual-dns-export
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  cert-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: manual-letsencrypt-cert
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
  backup-plugin:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/gmf-plugin"]
    environment:
      GMF_PLUGIN_NAME: local-filesystem-backup
      GMF_PLUGIN_SERVICE_TOKEN: dev-plugin-token
    volumes:
      - backup-data:/backup
volumes:
  backup-data:
